name: Test build
on:
  push:
permissions:
  contents: read
jobs:
  main:
    name: Main job
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Test
        run: ./script/test.sh
