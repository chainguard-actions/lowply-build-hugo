name: Test build
on:
  push:
permissions: {}
jobs:
  main:
    name: Main job
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Test
        run: ./script/test.sh
