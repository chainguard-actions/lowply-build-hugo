name: Catch up with Hugo
on:
  workflow_dispatch:
  schedule:
    # Runs at 18:50 JST every day
    - cron: "50 9 * * *"
permissions:
  contents: write
jobs:
  main:
    name: Main job
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Update
        id: update
        run: ./script/update.sh
