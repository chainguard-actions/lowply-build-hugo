name: Catch up with Hugo
on:
  workflow_dispatch:
  schedule:
    # Runs at 18:50 JST every day
    - cron: "50 9 * * *"
permissions: {}
jobs:
  main:
    name: Main job
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          token: ${{ secrets.GH_TOKEN }}
      - name: Update
        id: update
        run: ./script/update.sh
