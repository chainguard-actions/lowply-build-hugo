name: Test Hugo build with content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Hugo site with content
        run: |
          # Create a minimal Hugo site structure with content
          mkdir -p content/posts archetypes static layouts/_default

          cat > hugo.toml <<'EOF'
          baseURL = "http://example.org/"
          languageCode = "en-us"
          title = "Test Hugo Site"
          EOF

          # Create layouts
          cat > layouts/_default/baseof.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <body>{{ block "main" . }}{{ end }}</body>
          </html>
          EOF
          cat > layouts/_default/list.html <<'EOF'
          {{ define "main" }}<h1>{{ .Title }}</h1>{{ range .Pages }}<a href="{{ .Permalink }}">{{ .Title }}</a>{{ end }}{{ end }}
          EOF
          cat > layouts/_default/single.html <<'EOF'
          {{ define "main" }}<h1>{{ .Title }}</h1><div>{{ .Content }}</div>{{ end }}
          EOF
          cat > layouts/index.html <<'EOF'
          <!DOCTYPE html>
          <html><body><h1>Home</h1>{{ range .Pages }}<a href="{{ .Permalink }}">{{ .Title }}</a>{{ end }}</body></html>
          EOF

          # Create a sample post
          cat > content/posts/hello-world.md <<'EOF'
          ---
          title: "Hello World"
          date: 2024-01-01
          draft: false
          ---

          This is a test post.
          EOF

      - name: Run Hugo build action
        id: build
        uses: .

      - name: Assert Hugo built the site with content
        run: |
          echo "Checking for Hugo output..."
          if [ ! -d "public" ]; then
            echo "FAIL: public/ directory was not created"
            exit 1
          fi
          if [ ! -f "public/index.html" ]; then
            echo "FAIL: public/index.html was not created"
            exit 1
          fi
          if [ ! -d "public/posts" ]; then
            echo "FAIL: public/posts/ directory was not created"
            exit 1
          fi
          echo "PASS: Hugo successfully built the site with content"
          echo "Generated files:"
          find public/ -type f | sort
