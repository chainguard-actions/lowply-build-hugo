name: Test Hugo build output content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Hugo site in workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/archetypes"
          mkdir -p "$GITHUB_WORKSPACE/content"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hugo-site/archetypes/default.md" \
             "$GITHUB_WORKSPACE/archetypes/default.md"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hugo-site/content/_index.md" \
             "$GITHUB_WORKSPACE/content/_index.md"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hugo-site/hugo.toml" \
             "$GITHUB_WORKSPACE/hugo.toml"

      - id: build
        uses: .

      - name: Assert sitemap.xml was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/public/sitemap.xml" ]; then
            echo "FAIL: public/sitemap.xml was not generated"
            ls -la "$GITHUB_WORKSPACE/public/" || true
            exit 1
          fi
          echo "PASS: sitemap.xml exists"
          cat "$GITHUB_WORKSPACE/public/sitemap.xml"

      - name: Assert sitemap references the base URL
        run: |
          SITEMAP="$GITHUB_WORKSPACE/public/sitemap.xml"
          if ! grep -q "example.org" "$SITEMAP"; then
            echo "FAIL: expected baseURL 'example.org' not found in sitemap.xml"
            cat "$SITEMAP"
            exit 1
          fi
          echo "PASS: baseURL found in sitemap.xml"
