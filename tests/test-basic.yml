name: Test basic Hugo build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Hugo site in workspace
        run: |
          # Copy fixture Hugo site files into workspace root so the action can build it
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/hugo-site/." "$GITHUB_WORKSPACE/"
          echo "Hugo site files in workspace:"
          ls -la "$GITHUB_WORKSPACE/"
          echo "Layouts:"
          find "$GITHUB_WORKSPACE/layouts" -type f 2>/dev/null || echo "(no layouts)"
          echo "Content files:"
          find "$GITHUB_WORKSPACE/content" -type f 2>/dev/null || echo "(no content files)"
          echo "Config:"
          cat "$GITHUB_WORKSPACE/hugo.toml" 2>/dev/null || cat "$GITHUB_WORKSPACE/config.toml" 2>/dev/null || echo "(no config found)"

      - name: Build Hugo site
        id: build
        uses: .

      - name: Assert public directory was created
        run: |
          echo "Contents of workspace after build:"
          ls -la "$GITHUB_WORKSPACE/"
          if [ ! -d "$GITHUB_WORKSPACE/public" ]; then
            echo "FAIL: expected 'public' directory to be created by Hugo"
            exit 1
          fi
          echo "PASS: public directory exists"

      - name: Assert index.html was generated
        run: |
          echo "Contents of public directory:"
          find "$GITHUB_WORKSPACE/public" -type f | head -20
          if [ ! -f "$GITHUB_WORKSPACE/public/index.html" ]; then
            echo "FAIL: expected 'public/index.html' to be generated by Hugo"
            exit 1
          fi
          echo "PASS: index.html was generated"
          echo "--- index.html snippet ---"
          head -20 "$GITHUB_WORKSPACE/public/index.html"
