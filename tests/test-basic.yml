name: Test basic Hugo build
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up minimal Hugo site in workspace
        run: |
          # Create a minimal Hugo site structure at the workspace root
          # so the hugo entrypoint can find and build it
          cat > "$GITHUB_WORKSPACE/hugo.toml" <<'EOF'
          baseURL = "http://example.org/"
          languageCode = "en-us"
          title = "My Test Hugo Site"
          EOF

          mkdir -p "$GITHUB_WORKSPACE/layouts/_default"
          mkdir -p "$GITHUB_WORKSPACE/content"

          cat > "$GITHUB_WORKSPACE/layouts/_default/baseof.html" <<'EOF'
          <!DOCTYPE html>
          <html>
          <body>{{ block "main" . }}{{ end }}</body>
          </html>
          EOF

          cat > "$GITHUB_WORKSPACE/layouts/index.html" <<'EOF'
          {{ define "main" }}<h1>{{ .Title }}</h1>{{ end }}
          EOF

      - name: Build Hugo site
        id: build
        uses: .

      - name: Assert public directory was created
        run: |
          if [ ! -d "$GITHUB_WORKSPACE/public" ]; then
            echo "FAIL: Hugo did not create the public output directory"
            ls -la "$GITHUB_WORKSPACE" || true
            exit 1
          fi
          echo "PASS: public directory exists"

      - name: Assert index.html was generated
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/public/index.html" ]; then
            echo "FAIL: Hugo did not generate index.html"
            ls -la "$GITHUB_WORKSPACE/public" || true
            exit 1
          fi
          echo "PASS: index.html was generated"
          cat "$GITHUB_WORKSPACE/public/index.html"
