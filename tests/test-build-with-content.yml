name: Test Hugo build with content
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Hugo site with content in workspace
        run: |
          # Use config.toml (classic Hugo config format)
          cp "$GITHUB_WORKSPACE/tests/fixtures/hugo-site/config.toml" "$GITHUB_WORKSPACE/config.toml"
          # Copy archetypes
          mkdir -p "$GITHUB_WORKSPACE/archetypes"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hugo-site/archetypes/default.md" \
            "$GITHUB_WORKSPACE/archetypes/default.md"
          # Copy layouts so Hugo can generate HTML output
          mkdir -p "$GITHUB_WORKSPACE/layouts/_default"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hugo-site/layouts/_default/baseof.html" \
            "$GITHUB_WORKSPACE/layouts/_default/baseof.html"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hugo-site/layouts/_default/list.html" \
            "$GITHUB_WORKSPACE/layouts/_default/list.html"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hugo-site/layouts/_default/single.html" \
            "$GITHUB_WORKSPACE/layouts/_default/single.html"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hugo-site/layouts/index.html" \
            "$GITHUB_WORKSPACE/layouts/index.html"
          # Copy content
          mkdir -p "$GITHUB_WORKSPACE/content/posts"
          cp "$GITHUB_WORKSPACE/tests/fixtures/hugo-site/content/posts/hello-world.md" \
            "$GITHUB_WORKSPACE/content/posts/hello-world.md"
          echo "Hugo site with content ready"
          cat "$GITHUB_WORKSPACE/config.toml"

      - id: build
        uses: .

      - name: Assert Hugo generated output files
        run: |
          echo "Listing workspace..."
          ls -la "$GITHUB_WORKSPACE/" || true
          echo "Listing public directory..."
          ls -la "$GITHUB_WORKSPACE/public/" || true
          # Hugo should have created an index.html (with layouts) or at minimum index.xml
          if [ -f "$GITHUB_WORKSPACE/public/index.html" ]; then
            echo "PASS: public/index.html was generated by Hugo"
          elif [ -f "$GITHUB_WORKSPACE/public/index.xml" ]; then
            echo "PASS: public/index.xml was generated by Hugo (no HTML layouts)"
          elif [ -d "$GITHUB_WORKSPACE/public" ]; then
            echo "PASS: public/ directory was created by Hugo"
            ls -la "$GITHUB_WORKSPACE/public/"
          else
            echo "FAIL: Hugo did not generate any output in public/"
            exit 1
          fi
