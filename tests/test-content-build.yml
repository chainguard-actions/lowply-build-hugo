name: Test Hugo build with content pages
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up git origin reachable inside the Docker container
        run: |
          git config user.email "test@example.com"
          git config user.name "Test User"
          rm -rf "$GITHUB_WORKSPACE/.git-remote"
          git init --bare "$GITHUB_WORKSPACE/.git-remote"
          git push "$GITHUB_WORKSPACE/.git-remote" HEAD:refs/heads/act-harness
          git remote set-url origin "$GITHUB_WORKSPACE/.git-remote" 2>/dev/null || \
            git remote add origin "$GITHUB_WORKSPACE/.git-remote"

      - name: Set up Hugo site with content pages in workspace
        run: |
          cp -r "$GITHUB_WORKSPACE/tests/fixtures/hugo-site-with-content/." "$GITHUB_WORKSPACE/"
          rm -rf "$GITHUB_WORKSPACE/public"
          echo "--- Workspace contents after setup ---"
          ls -la "$GITHUB_WORKSPACE/"
          echo "--- layouts directory ---"
          ls -la "$GITHUB_WORKSPACE/layouts/" || echo "no layouts dir"
          echo "--- content directory ---"
          find "$GITHUB_WORKSPACE/content" -type f | head -20 || true

      - id: build
        uses: .

      - name: Assert public directory was created
        run: |
          echo "Checking for public/ directory..."
          if [ ! -d "$GITHUB_WORKSPACE/public" ]; then
            echo "FAIL: public/ directory was not created by hugo build"
            exit 1
          fi
          echo "PASS: public/ directory exists"
          echo "--- Contents of public/ ---"
          find "$GITHUB_WORKSPACE/public" -type f | head -30 || true

      - name: Assert content post was rendered
        run: |
          echo "Checking for rendered post HTML..."
          # Hugo renders posts under public/posts/hello-world/index.html
          POST_FILE="$GITHUB_WORKSPACE/public/posts/hello-world/index.html"
          if [ ! -f "$POST_FILE" ]; then
            echo "FAIL: rendered post not found at $POST_FILE"
            echo "Contents of public/:"
            find "$GITHUB_WORKSPACE/public" -type f | head -20 || true
            exit 1
          fi
          echo "PASS: post rendered at $POST_FILE"
          echo "--- Content preview ---"
          head -20 "$POST_FILE"

      - name: Assert post content contains expected text
        run: |
          echo "Checking post content..."
          POST_FILE="$GITHUB_WORKSPACE/public/posts/hello-world/index.html"
          if ! grep -q "Hello World" "$POST_FILE"; then
            echo "FAIL: 'Hello World' title not found in rendered post"
            cat "$POST_FILE" || true
            exit 1
          fi
          echo "PASS: post title found in rendered HTML"
